# Chaîne planifiée de Curation AI (P5, ADR 0006) : collecte, approfondissement, brouillons, contrôles, planification,
# traduction, puis publication dans le plafond de 20 par jour (npm run lancer).
# - Désactivée tant que la variable de dépôt CHAINE_ACTIVE ne vaut pas « oui » (Settings → Secrets and variables →
#   Actions → Variables) : sans elle, le job est sauté et rien ne tourne.
# - Rythme (ADR 0006, décision de l'utilisateur du 2026-11-06 : dépôt public, objectif 20 min de l'annonce au fil) : le
#   Worker Cloudflare `infra/declencheur/` lance ce workflow toutes les 10 min (workflow_dispatch) ; le cron ci-dessous,
#   toutes les 15 min, n'est qu'un filet de sécurité, car GitHub ne garantit ni l'heure ni l'exécution d'un cron. Dépôt
#   public : minutes Actions sans quota.
# - Un seul cycle à la fois (concurrency) ; les secrets ne viennent que des secrets du dépôt.
name: Chaîne planifiée

on:
  schedule:
    - cron: '4-59/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaine-curation
  cancel-in-progress: false

jobs:
  cycle:
    if: vars.CHAINE_ACTIVE == 'oui'
    runs-on: ubuntu-latest
    # 45 min (2026-11-11) : avec ~175 sources et la découverte GitHub, un cycle dépassait les 20 min et GitHub l'arrêtait
    # avant la publication. Dépôt public : minutes sans quota ; un seul cycle à la fois (concurrency).
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # Jeton intégré de l'exécution (lecture seule, permissions ci-dessus), envoyé seulement à api.github.com : 1 000
      # requêtes par heure au lieu de 60, recherche 30 par minute au lieu de 10 (documentation GitHub, 2026-11-10).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Adresse de contact exigée par la SEC pour déclarer le client EDGAR (2026-11-05) ; absente : sources EDGAR différées.
      CURATION_CONTACT_SEC: ${{ secrets.CURATION_CONTACT_SEC }}
      CURATION_MODELE: deepseek-flash
      # Plafonds explicites. Sans variable de dépôt pour le total et le jour, les étapes payantes sont sautées.
      # 30 par cycle (2026-11-05) : le cron de GitHub saute des heures entières (aucun cycle de 03:28 à 12:14 UTC), et 10
      # ne suffisaient pas à suivre ~150 actualités en attente. Les plafonds par exécution, jour et total restent inchangés.
      CURATION_MAX_ACTUALITES: '30'
      CURATION_MAX_TRADUCTIONS: '20'
      # Rédaction des découvertes réactivée progressivement le 2026-11-10 : 2 par cycle. Essai du 2026-11-05 : 0 publiable sur
      # 5 ; lots réels du 2026-11-10 après motif des sorties illisibles et élagage des éléments secondaires : 1 planifié sur
      # 6 rédigés, les autres « à vérifier » (rien de faux publié), pour 0,063 $ les 10 dépôts notés. Porté à 6 par cycle le
      # 2026-11-11 à la demande de l'utilisateur (90 dépôts en attente) ; les plafonds par cycle, jour et total s'appliquent.
      CURATION_MAX_DECOUVERTES: '6'
      # Plafonds relevés le 2026-11-05 avec l'accord de l'utilisateur (« tu peux déplacer le plafond, je t'autorise ») :
      # 0,10 $ par cycle (30 actualités et 5 relances tiennent), 0,40 $ par jour. Le total autorisé reste 4 $ (variable du dépôt).
      CURATION_PLAFOND_EXECUTION_USD: '0.10'
      CURATION_PLAFOND_JOUR_USD: '0.40'
      CURATION_PLAFOND_TOTAL_USD: ${{ vars.CURATION_PLAFOND_TOTAL_USD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Cycle
        run: npm run lancer -- --confirmer
      - name: État après le cycle
        if: always()
        run: npm run etat
