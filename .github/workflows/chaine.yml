# Chaîne planifiée de Curation AI (P5, ADR 0006) : collecte, approfondissement, brouillons, contrôles, planification,
# traduction, puis publication dans le plafond de 20 par jour (npm run lancer).
# - Désactivée tant que la variable de dépôt CHAINE_ACTIVE ne vaut pas « oui » (Settings → Secrets and variables →
#   Actions → Variables) : sans elle, le job est sauté et rien ne tourne.
# - Toutes les heures, à la minute 7 (décision de l'utilisateur du 2026-11-04 : dépôt privé, quota gratuit de GitHub
#   Actions d'environ 2 000 minutes par mois ; passage au dépôt public et à « 2-59/5 * * * * » si l'heure ne suffit
#   pas). GitHub ne garantit ni l'heure ni l'exécution d'un cron ; la minute 7 évite le début d'heure, plus chargé.
# - Un seul cycle à la fois (concurrency) ; les secrets ne viennent que des secrets du dépôt.
name: Chaîne planifiée

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chaine-curation
  cancel-in-progress: false

jobs:
  cycle:
    if: vars.CHAINE_ACTIVE == 'oui'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CURATION_MODELE: deepseek-flash
      # Plafonds explicites. Sans variable de dépôt pour le total et le jour, les étapes payantes sont sautées.
      # 30 par cycle (2026-11-05) : le cron de GitHub saute des heures entières (aucun cycle de 03:28 à 12:14 UTC), et 10
      # ne suffisaient pas à suivre ~150 actualités en attente. Les plafonds par exécution, jour et total restent inchangés.
      CURATION_MAX_ACTUALITES: '30'
      CURATION_MAX_TRADUCTIONS: '20'
      # CURATION_MAX_DECOUVERTES : absent tant que la rédaction des découvertes n'est pas assez fiable (essai du 2026-11-05 :
      # 0 publiable sur 5) ; sans elle, l'étape payante « redaction_decouvertes » est sautée. La recherche reste active.
      CURATION_PLAFOND_EXECUTION_USD: '0.05'
      CURATION_PLAFOND_JOUR_USD: ${{ vars.CURATION_PLAFOND_JOUR_USD }}
      CURATION_PLAFOND_TOTAL_USD: ${{ vars.CURATION_PLAFOND_TOTAL_USD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Cycle
        run: npm run lancer -- --confirmer
      - name: État après le cycle
        if: always()
        run: npm run etat
